<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MKS Rental Calculator</title>
<style>
:root {
--bg: #96E2EA;
--card: #ffffff;
--text: #111111;
--muted: #666666;
--border: #dddddd;
--blue: #007bff;
--green: #28a745;
--wa: #25D366;
--warning: #fff3cd;
}
 
body.dark {
--bg: #111827;
--card: #1f2937;
--text: #f9fafb;
--muted: #d1d5db;
--border: #374151;
--warning: #4b3b12;
}
 
body {
font-family: Arial, sans-serif;
background: var(--bg);
color: var(--text);
padding: 20px;
margin: auto;
display: flex;
flex-direction: column;
align-items: center;
}

/* UI Fix: Constrain the layout so it doesn't stretch infinitely on wide screens */
.app-container {
width: 100%;
max-width: 650px; 
box-sizing: border-box;
}
 
.card {
background: var(--card);
padding: 20px;
border-radius: 14px;
box-shadow: 0 3px 12px rgba(0,0,0,0.12);
margin-bottom: 20px;
}
 
label {
display: block;
margin-top: 12px;
font-weight: bold;
}
 
input, textarea {
width: 100%;
padding: 11px;
margin-top: 5px;
box-sizing: border-box;
border: 1px solid var(--border);
border-radius: 8px;
font-size: 15px;
background: var(--card);
color: var(--text);
}
 
textarea {
min-height: 120px;
white-space: pre-wrap;
}
 
button {
padding: 12px 18px;
margin-top: 12px;
margin-right: 6px;
border: none;
border-radius: 8px;
cursor: pointer;
font-size: 15px;
font-weight: bold;
transition: opacity 0.2s;
}

button:hover {
opacity: 0.9;
}
 
.btn-primary { background: var(--blue); color: #fff; }
.btn-copy { background: var(--green); color: #fff; }
.btn-wa { background: var(--wa); color: #fff; }
.btn-dark { background: #374151; color: #fff; }
 
.summary {
background: rgba(0,123,255,0.12);
padding: 15px;
border-radius: 10px;
margin-top: 15px;
}
 
.warning {
background: var(--warning);
padding: 12px;
border-radius: 8px;
margin-top: 12px;
font-weight: bold;
}
 
.small {
color: var(--muted);
font-size: 14px;
}

.flex-row {
display: flex;
gap: 10px;
}
.flex-row div {
flex: 1;
}
</style>
</head>
 
<body>

<div class="app-container">
<div class="card">
<div style="display: flex; justify-content: space-between; align-items: center;">
<h1>Mat Kipas Sejuk</h1>
<button class="btn-dark" style="margin:0;" onclick="toggleDarkMode()">🌙 Mode</button>
</div>
<h2>Rental Calculator</h2>
 
<label>Quotation No</label>
<input type="text" id="quoteNo" readonly>
 
<label>Nama Customer</label>
<input type="text" id="customerName" placeholder="Contoh: Restoran XYZ" oninput="saveToMemory()">
 
<label>No Telefon Customer</label>
<input type="text" id="phone" placeholder="Contoh: 012-3456789" oninput="saveToMemory()">
 
<label>Alamat Lokasi</label>
<textarea id="address" placeholder="Alamat penuh lokasi sewaan" oninput="saveToMemory()"></textarea>
 
<label>Sales / PIC</label>
<input type="text" id="pic" placeholder="Contoh: Yazid" oninput="saveToMemory()">
 
<div class="flex-row">
<div>
<label>Bilangan Unit</label>
<input type="number" id="unit" value="1" min="1" oninput="updateEndDatePreview(); saveToMemory();">
</div>
<div>
<label>Bilangan Hari Sewa</label>
<input type="number" id="days" value="30" min="1" oninput="updateEndDatePreview(); saveToMemory();">
</div>
</div>
 
<label>Tarikh Mula Sewaan</label>
<input type="date" id="startDate" onchange="updateEndDatePreview(); saveToMemory();">
 
<p class="small"><strong>Tarikh Tamat:</strong> <span id="endDatePreview">-</span></p>
 
<label>Jumlah Bayaran Customer (RM)</label>
<input type="number" id="rental" placeholder="Contoh: 600" oninput="saveToMemory()">
 
<div class="flex-row">
<div>
<label>Deposit Diterima (RM)</label>
<input type="number" id="deposit" value="0" oninput="saveToMemory()">
</div>
<div>
<label>Kos Transport (RM)</label>
<input type="number" id="transport" value="0" oninput="saveToMemory()">
</div>
</div>
 
<div style="display:flex; gap: 8px;">
<button class="btn-primary" style="flex: 2;" onclick="calculate()">Kira & Generate Text</button>
<button class="btn-dark" style="flex: 1; background: #6b7280;" onclick="clearMemory()">Reset</button>
</div>
</div>
 
<div id="result"></div>
</div>
 
<script>
// --- CONFIGURATION & MEMORY LOGIC ---
const STORAGE_KEY = "MKS_CALCULATOR_DATA";
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwLtMUSkyaJhgt11W4xdo6KJXSeb2L3sW0GHN_mKa-xSO7MvJwzPKcQSy6jyX7K4_I/exec";

function generateDocNo(prefix) {
const now = new Date();
const y = now.getFullYear();
const m = String(now.getMonth() + 1).padStart(2, "0");
const d = String(now.getDate()).padStart(2, "0");
const random = String(Math.floor(Math.random() * 999) + 1).padStart(3, "0");
return prefix + "-" + y + m + d + "-" + random;
}

// LocalStorage Persistence
function saveToMemory() {
const data = {
customerName: document.getElementById("customerName").value,
phone: document.getElementById("phone").value,
address: document.getElementById("address").value,
pic: document.getElementById("pic").value,
unit: document.getElementById("unit").value,
days: document.getElementById("days").value,
startDate: document.getElementById("startDate").value,
rental: document.getElementById("rental").value,
deposit: document.getElementById("deposit").value,
transport: document.getElementById("transport").value,
quoteNo: document.getElementById("quoteNo").value
};
localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadFromMemory() {
const stored = localStorage.getItem(STORAGE_KEY);
if (stored) {
const data = JSON.parse(stored);
document.getElementById("customerName").value = data.customerName || "";
document.getElementById("phone").value = data.phone || "";
document.getElementById("address").value = data.address || "";
document.getElementById("pic").value = data.pic || "";
document.getElementById("unit").value = data.unit || 1;
document.getElementById("days").value = data.days || 30;
document.getElementById("startDate").value = data.startDate || "";
document.getElementById("rental").value = data.rental || "";
document.getElementById("deposit").value = data.deposit || 0;
document.getElementById("transport").value = data.transport || 0;
document.getElementById("quoteNo").value = data.quoteNo || generateDocNo("QT");
updateEndDatePreview();
} else {
document.getElementById("quoteNo").value = generateDocNo("QT");
}
}

function clearMemory() {
if(confirm("Adakah anda pasti mahu set semula semua data input?")) {
localStorage.removeItem(STORAGE_KEY);
location.reload();
}
}

// Initialization
window.onload = function() {
loadFromMemory();
};
 
function formatRM(value) {
return "RM " + Number(value || 0).toFixed(2);
}
 
function formatDate(dateString) {
if (!dateString) return "-";
const date = new Date(dateString);
return date.toLocaleDateString("ms-MY", { day: "2-digit", month: "2-digit", year: "numeric" });
}
 
function calculateEndDate(startDate, days) {
if (!startDate || days < 1) return "-";
const date = new Date(startDate);
date.setDate(date.getDate() + days - 1);
return date.toLocaleDateString("ms-MY", { day: "2-digit", month: "2-digit", year: "numeric" });
}
 
function updateEndDatePreview() {
const startDate = document.getElementById("startDate").value;
const days = Number(document.getElementById("days").value);
document.getElementById("endDatePreview").innerText = calculateEndDate(startDate, days);
}
 
function cleanPhone(phone) {
let cleaned = phone.replace(/\D/g, "");
if (cleaned.startsWith("0")) cleaned = "6" + cleaned;
if (!cleaned.startsWith("6")) cleaned = "6" + cleaned;
return cleaned;
}
 
function calculate() {
const quoteNo = document.getElementById("quoteNo").value;
const customerName = document.getElementById("customerName").value || "-";
const phone = document.getElementById("phone").value || "-";
const address = document.getElementById("address").value || "-";
const pic = document.getElementById("pic").value || "-";
 
const unit = Number(document.getElementById("unit").value);
const days = Number(document.getElementById("days").value);
const startDate = document.getElementById("startDate").value;
 
const rental = Number(document.getElementById("rental").value);
const deposit = Number(document.getElementById("deposit").value);
const transport = Number(document.getElementById("transport").value);
 
if (unit < 1 || days < 1 || rental < 0) {
alert("Sila semak bilangan unit, hari sewa dan jumlah bayaran.");
return;
}
 
const companySharePerUnit = rental * (30/100);
const companyShareTotal = companySharePerUnit * unit;
const commission = rental - companyShareTotal - transport;
const balance = rental - deposit;
 
const startDateText = formatDate(startDate);
const endDateText = calculateEndDate(startDate, days);
 
const internalText =
`📋 MKS RENTAL BREAKDOWN\n\n` +
`Quotation No : ${quoteNo}\n\n` +
`Customer : ${customerName}\n` +
`Telefon : ${phone}\n\n` +
`Alamat :\n${address}\n\n` +
`Sales / PIC : ${pic}\n\n` +
`Bilangan Unit : ${unit}\n` +
`Tempoh Sewa : ${days} hari\n` +
`Tarikh Mula : ${startDateText}\n` +
`Tarikh Tamat : ${endDateText}\n\n` +
`💰 Jumlah Bayaran Customer\n${formatRM(rental)}\n\n` +
`💳 Deposit Diterima\n${formatRM(deposit)}\n\n` +
`🧾 Baki Bayaran Customer\n${formatRM(balance)}\n\n` +
`🏢 Share Syarikat\n${formatRM(companyShareTotal)}\n` +
`(${formatRM(companySharePerUnit)} x ${unit} unit)\n\n` +
`🚚 Kos Transport\n${formatRM(transport)}\n\n` +
`💵 Komisyen / Baki Team\n${formatRM(commission)}\n`;
 
const customerText =
`Assalamualaikum / Salam Sejahtera.\n\n` +
`Berikut adalah sebut harga sewaan Aircooler Gergasi daripada Mat Kipas Sejuk.\n\n` +
`Quotation No : ${quoteNo}\n\n` +
`Nama : ${customerName}\n` +
`Telefon : ${phone}\n\n` +
`Alamat Lokasi :\n${address}\n\n` +
`📦 Bilangan Unit : ${unit} unit\n` +
`📅 Tempoh Sewaan : ${days} hari\n` +
`🗓️ Tarikh Mula : ${startDateText}\n` +
`🗓️ Tarikh Tamat : ${endDateText}\n\n` +
`💰 Jumlah Sewaan\n${formatRM(rental)}\n\n` +
`💳 Deposit\n${formatRM(deposit)}\n\n` +
`🧾 Baki Bayaran\n${formatRM(balance)}\n\n` +
`Harga termasuk:\n` +
`✅ Sewaan Aircooler Gergasi\n` +
`✅ Bantuan pemasangan\n` +
`✅ Delivery\n\n` +
`Terima kasih kerana memilih Mat Kipas Sejuk.\n\n` +
`www.matkipassejuk.my\n`;
 
let warning = "";
if (commission < 0) warning += `<div class="warning">⚠️ Komisyen negatif. Sila semak harga sewaan atau kos transport.</div>`;
if (balance < 0) warning += `<div class="warning">⚠️ Deposit lebih tinggi daripada jumlah sewaan. Sila semak semula.</div>`;
 
document.getElementById("result").innerHTML = `
<div class="card">
<h2>Ringkasan Kiraan</h2>
 
<div class="summary">
<p><strong>Jumlah Bayaran Customer:</strong> ` + formatRM(rental) + `</p>
<p><strong>Deposit:</strong> ` + formatRM(deposit) + `</p>
<p><strong>Baki Bayaran:</strong> ` + formatRM(balance) + `</p>
<p><strong>Share Syarikat:</strong> ` + formatRM(companyShareTotal) + `</p>
<p><strong>Kos Transport:</strong> ` + formatRM(transport) + `</p>
<p><strong>Komisyen / Baki Team:</strong> ` + formatRM(commission) + `</p>
</div>
 
<button class="btn-primary" style="width:100%; margin-top:15px;" onclick="saveRecord()">
💾 Save Job to Google Sheet
</button>
 
` + warning + `
</div>
 
<div class="card">
<h2>Copy Text #1 - Internal MKS</h2>
<textarea id="internalText"></textarea>
<button class="btn-copy" onclick="copyText('internalText')">📋 Copy Internal</button>
<button class="btn-wa" onclick="sendWhatsapp('internalText')">📱 WhatsApp Internal</button>
</div>
 
<div class="card">
<h2>Copy Text #2 - Quote Customer</h2>
<textarea id="customerText"></textarea>
<button class="btn-copy" onclick="copyText('customerText')">📋 Copy Quote</button>
<button class="btn-wa" onclick="sendWhatsappToCustomer('customerText')">📱 WhatsApp Customer</button>
<div style="display: flex; gap: 4px; margin-top:8px; flex-wrap: wrap;">
<button class="btn-primary" style="flex:1;" onclick="printDocument('QT')">🖨️ Print Quotation</button>
<button class="btn-primary" style="flex:1; background:#4f46e5;" onclick="printDocument('INV')">🧾 Print Invoice</button>
<button class="btn-primary" style="flex:1; background:#0891b2;" onclick="printDocument('RCPT')">💵 Print Receipt</button>
</div>
</div>
`;

document.getElementById("internalText").value = internalText;
document.getElementById("customerText").value = customerText;
}
 
function copyText(id) {
const textArea = document.getElementById(id);
textArea.select();
navigator.clipboard.writeText(textArea.value)
.then(() => alert("Text copied!"))
.catch(() => alert("Copy failed. Sila copy manual."));
}
 
function sendWhatsapp(id) {
const text = document.getElementById(id).value;
window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}
 
function sendWhatsappToCustomer(id) {
const text = document.getElementById(id).value;
const phone = document.getElementById("phone").value;
if (!phone || phone === "-") { sendWhatsapp(id); return; }
const clean = cleanPhone(phone);
window.open("https://wa.me/" + clean + "?text=" + encodeURIComponent(text), "_blank");
}
 
function toggleDarkMode() {
document.body.classList.toggle("dark");
}
 
async function saveRecord() {
const btn = document.querySelector("button[onclick='saveRecord()']");
if (btn) { btn.disabled = true; btn.innerText = "⏳ Saving..."; }
 
try {
const quoteNo = document.getElementById("quoteNo").value;
const rental = parseFloat(document.getElementById("rental").value) || 0;
const deposit = parseFloat(document.getElementById("deposit").value) || 0;
 
const data = {
jobId: quoteNo.replace("QT-",""),
qtNo: quoteNo,
invNo: quoteNo.replace("QT-","INV-"),
rcptNo: quoteNo.replace("QT-","RCPT-"),
customerName: document.getElementById("customerName").value,
phone: document.getElementById("phone").value,
address: document.getElementById("address").value,
unit: document.getElementById("unit").value,
days: document.getElementById("days").value,
rental: rental,
deposit: deposit,
balance: rental - deposit,
status: "Quoted",
pic: document.getElementById("pic").value
};
 
const response = await fetch(WEBAPP_URL, {
method: "POST",
mode: "no-cors",
headers: { 
"Content-Type": "application/json",
"X-App-Token": "MKS-SECURE-2026" // Basic protection verification header
},
body: JSON.stringify(data)
});
 
alert("🎉 Job successfully saved to Google Sheet!");
localStorage.removeItem(STORAGE_KEY); // Clean local state once submitted safely
} catch (error) {
console.error("Error saving record:", error);
alert("❌ Failed to save job. Check console for details.");
} finally {
if (btn) { btn.disabled = false; btn.innerText = "💾 Save Job to Google Sheet"; }
}
}
 
// --- DRY CENTRALIZED DOCUMENT PRINTER ---
function printDocument(type) {
const quoteNo = document.getElementById("quoteNo").value;
let docTitle = "Quotation";
let docNo = quoteNo;
 
if (type === 'INV') { docTitle = "Invoice"; docNo = quoteNo.replace("QT-", "INV-"); }
if (type === 'RCPT') { docTitle = "Official Receipt"; docNo = quoteNo.replace("QT-", "RCPT-"); }

const customerName = document.getElementById("customerName").value || "-";
const phone = document.getElementById("phone").value || "-";
const address = document.getElementById("address").value || "-";
const unit = Number(document.getElementById("unit").value || 0);
const days = Number(document.getElementById("days").value || 0);
const startDate = document.getElementById("startDate").value;
const rental = Number(document.getElementById("rental").value || 0);
const transport = Number(document.getElementById("transport").value || 0);
const deposit = Number(document.getElementById("deposit").value || 0);

const grandTotal = rental + transport;
const balanceDue = grandTotal - deposit;
 
const today = new Date().toLocaleDateString("ms-MY", { day: "2-digit", month: "2-digit", year: "numeric" });
const startDateText = startDate ? new Date(startDate).toLocaleDateString("ms-MY", { day: "2-digit", month: "2-digit", year: "numeric" }) : "-";
const endDateObj = startDate ? new Date(startDate) : null;
if (endDateObj) { endDateObj.setDate(endDateObj.getDate() + days - 1); }
const endDateText = endDateObj ? endDateObj.toLocaleDateString("ms-MY", { day: "2-digit", month: "2-digit", year: "numeric" }) : "-";
 
// Dynamically compute lower financial structures based on doc type
let financialBoxHTML = `
<div class="flex justify-between"><span class="text-gray-600">Total Rental</span><span class="font-medium">RM ${rental.toFixed(2)}</span></div>
<div class="flex justify-between"><span class="text-gray-600">Transport Cost</span><span class="font-medium">RM ${transport.toFixed(2)}</span></div>
<div class="flex justify-between border-t-2 border-blue-200 pt-2"><span class="font-bold text-blue-900">Grand Total</span><span class="font-bold text-blue-900">RM ${grandTotal.toFixed(2)}</span></div>
`;

if (type === 'INV') {
financialBoxHTML += `
<div class="flex justify-between text-gray-600"><span>Paid (Deposit)</span><span>- RM ${deposit.toFixed(2)}</span></div>
<div class="flex justify-between border-t-2 border-red-200 pt-2 text-red-700"><span class="font-bold">Balance Due</span><span class="font-bold">RM ${balanceDue.toFixed(2)}</span></div>
`;
} else if (type === 'RCPT') {
financialBoxHTML = `
<div class="flex justify-between text-green-700 bg-green-50 p-2 rounded border border-green-200"><span class="font-bold">Amount Paid</span><span class="font-bold">RM ${deposit.toFixed(2)}</span></div>
<div class="flex justify-between pt-2 text-xs text-gray-500"><span>Remaining Outstanding</span><span>RM ${balanceDue.toFixed(2)}</span></div>
`;
}

const printWindow = window.open("", "_blank");
printWindow.document.write(`
<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>${docTitle} ${docNo}</title>
<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'DM Sans', sans-serif; background: #f1f5f9; padding: 24px; color: #111827; }
.invoice-container { background: linear-gradient(135deg, #ffffff 0%, #fafbfc 100%); }
.header-accent { border-bottom: 3px solid #2563eb; }
.total-box { background: #f8fafc; border-left: 4px solid #2563eb; }
@media print { body { background: white; padding: 0; } .no-print { display: none; } main { box-shadow: none !important; border: none !important; } }
</style>
</head>
<body>
<div class="no-print max-w-3xl mx-auto mb-4 text-right">
<button onclick="window.print()" style="background:#2563eb;color:white;padding:12px 20px;border-radius:8px;font-weight:bold;">Print / Save PDF</button>
</div>
<main class="max-w-3xl mx-auto invoice-container rounded-xl shadow-md border border-gray-300 overflow-hidden">
<header class="flex justify-between items-start p-8 pb-6 header-accent">
<div>
<div class="flex items-center gap-4">
<div class="w-16 h-16 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-xl">MKS</div>
<div>
<h1 class="font-bold text-2xl text-gray-900">MAT KIPAS SEJUK VENTURE</h1>
<p class="mt-1 text-gray-600 text-xs">No. 36-2, Jalan Sri Perkasa 1/3, Taman Tampoi Utama, 81200, Johor Bahru</p>
<p class="text-gray-600 text-xs">www.matkipassejuk.my | +6011 7569 5852 | 003862837-A</p>
</div>
</div>
</div>
<div class="text-right"><h2 class="font-bold uppercase tracking-wider text-xl text-blue-900">${docTitle}</h2></div>
</header>
<div class="p-8">
<div class="grid grid-cols-2 gap-8 mb-8">
<div>
<p class="font-medium uppercase text-xs tracking-wider mb-2 text-gray-500">Bill To</p>
<p class="font-medium text-gray-900">${customerName}</p>
<p class="text-gray-600 text-sm whitespace-pre-line">${address}</p>
<p class="text-gray-600 text-sm">${phone}</p>
</div>
<div class="text-right space-y-1 text-sm text-gray-600">
<p><strong>${docTitle} No:</strong> ${docNo}</p>
<p><strong>Date:</strong> ${today}</p>
<p><strong>Rental Start:</strong> ${startDateText}</p>
<p><strong>Rental End:</strong> ${endDateText}</p>
</div>
</div>
<table class="w-full mb-6 border-collapse text-sm">
<thead>
<tr class="border-b-2 border-blue-900 bg-gray-50">
<th class="py-3 px-2 font-semibold text-gray-700 text-left">Description</th>
<th class="py-3 px-2 font-semibold text-gray-700 text-center w-20">Qty</th>
<th class="py-3 px-2 font-semibold text-gray-700 text-right w-28">Duration</th>
<th class="py-3 px-2 font-semibold text-gray-700 text-right w-32">Amount</th>
</tr>
</thead>
<tbody>
<tr class="border-b border-gray-200">
<td class="py-3 px-2 text-gray-800 font-medium">Sewaan Aircooler Gergasi Mat Kipas Sejuk</td>
<td class="py-3 px-2 text-center text-gray-800">${unit}</td>
<td class="py-3 px-2 text-right text-gray-800">${days} hari</td>
<td class="py-3 px-2 text-right text-gray-800">RM ${rental.toFixed(2)}</td>
</tr>
<tr class="border-b border-gray-200">
<td class="py-3 px-2 text-gray-800">Kos Transport / Penghantaran & Pemasangan</td>
<td class="py-3 px-2 text-center text-gray-800">1</td>
<td class="py-3 px-2 text-right text-gray-800">-</td>
<td class="py-3 px-2 text-right text-gray-800">RM ${transport.toFixed(2)}</td>
</tr>
</tbody>
</table>
<div class="flex justify-end mb-6">
<div class="w-72 space-y-2 total-box p-4 rounded-lg text-sm">
${financialBoxHTML}
</div>
</div>
 
<div class="mb-6 p-4 bg-blue-50/60 rounded-xl border border-blue-100 text-xs">
<h3 class="font-bold text-blue-900 tracking-wide uppercase mb-1">📌 Terms & Information:</h3>
<ul class="text-gray-700 space-y-1 list-disc pl-5">
<li>A commitment deposit is required to secure booking dates. Balance payments are handled contextually upon structural deployment or arrival.</li>
<li>Computer-generated document; no signature required.</li>
</ul>
</div>
 
<footer class="border-t border-gray-100 pt-4 text-xs flex justify-between items-end">
<div>
<p class="font-medium mb-0.5 text-gray-700">Payment Status</p>
<p class="text-gray-500">${type === 'RCPT' ? 'Paid / Documented' : 'Pending Verification / Receipt Settlement'}</p>
</div>
<p class="text-gray-400 italic font-medium">Terima Kasih Dari Mat Kipas Sejuk</p>
</footer>
</div>
</main>
</body>
</html>
`);
printWindow.document.close();
}
</script>
</body>
</html>
