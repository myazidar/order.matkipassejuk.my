<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MKS Rental Calculator</title>
<style>
:root {
--bg: #e0f4f6;
--card: #ffffff;
--text: #1f2937;
--muted: #4b5563;
--border: #e5e7eb;
--blue: #2563eb;
--green: #16a34a;
--wa: #22c55e;
--warning: #fef3c7;
--accent: #0284c7;
}
 
body.dark {
--bg: #111827;
--card: #1f2937;
--text: #f9fafb;
--muted: #9ca3af;
--border: #374151;
--warning: #78350f;
}
 
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
background: var(--bg);
color: var(--text);
padding: 24px 16px;
margin: auto;
display: flex;
flex-direction: column;
align-items: center;
line-height: 1.5;
}

.app-container {
width: 100%;
max-width: 600px; 
box-sizing: border-box;
}
 
.card {
background: var(--card);
padding: 24px;
border-radius: 16px;
box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
margin-bottom: 20px;
border: 1px solid var(--border);
}
 
label {
display: block;
margin-top: 14px;
font-weight: 600;
font-size: 14px;
color: var(--text);
}
 
input, textarea, select {
width: 100%;
padding: 12px;
margin-top: 6px;
box-sizing: border-box;
border: 1px solid var(--border);
border-radius: 10px;
font-size: 15px;
background: var(--card);
color: var(--text);
transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus, textarea:focus, select:focus {
outline: none;
border-color: var(--blue);
box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
 
textarea {
min-height: 100px;
white-space: pre-wrap;
resize: vertical;
}
 
button {
padding: 12px 20px;
margin-top: 12px;
margin-right: 4px;
border: none;
border-radius: 10px;
cursor: pointer;
font-size: 15px;
font-weight: 600;
transition: all 0.2s ease;
display: inline-flex;
align-items: center;
justify-content: center;
gap: 8px;
}

button:hover {
opacity: 0.95;
transform: translateY(-1px);
}

button:active {
transform: translateY(0);
}
 
.btn-primary { background: var(--blue); color: #fff; }
.btn-copy { background: #4b5563; color: #fff; }
.btn-wa { background: var(--wa); color: #fff; }
.btn-dark { background: #374151; color: #fff; }
.btn-success { background: var(--green); color: #fff; }
 
.summary {
background: rgba(37, 99, 235, 0.06);
padding: 18px;
border-radius: 12px;
margin-top: 16px;
border: 1px solid rgba(37, 99, 235, 0.1);
}

.summary p {
margin: 8px 0;
display: flex;
justify-content: space-between;
}
 
.warning {
background: var(--warning);
padding: 14px;
border-radius: 10px;
margin-top: 14px;
font-weight: 600;
font-size: 14px;
border-left: 4px solid #d97706;
}
 
.small {
color: var(--muted);
font-size: 13px;
margin-top: 6px;
}

.flex-row {
display: flex;
gap: 12px;
}
.flex-row div {
flex: 1;
}

h1 { font-size: 24px; font-weight: 700; margin: 0; color: var(--blue); }
h2 { font-size: 18px; font-weight: 700; margin: 0 0 16px 0; }
</style>
</head>
 
<body>

<div class="app-container">
<div class="card" style="border: 2px solid var(--blue); background: rgba(37, 99, 235, 0.02);">
  <h2>🔍 Carian Rekod Lama</h2>
  <div style="display: flex; gap: 8px;">
    <input type="text" id="searchQt" placeholder="Masukkan QT No Penuh (Contoh: QT-20260708-123)" style="margin-top:0; flex: 2;">
    <button class="btn-primary" style="margin-top:0; flex: 1; background: #4f46e5;" onclick="searchRecord()">Cari Job</button>
  </div>
</div>

<div class="card">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
<div>
  <h1>Mat Kipas Sejuk</h1>
  <p class="small" style="margin:0;">Rental Calculator v2.2</p>
</div>
<button class="btn-dark" style="margin:0; padding: 8px 14px; font-size: 13px;" onclick="toggleDarkMode()">🌙 Mode</button>
</div>
 
<label>Quotation No</label>
<input type="text" id="quoteNo" readonly style="background: rgba(0,0,0,0.03); font-weight: bold; color: var(--muted);">
 
<label>Nama Customer</label>
<input type="text" id="customerName" placeholder="Contoh: Restoran XYZ" oninput="saveToMemory()">
 
<label>No Telefon Customer</label>
<input type="text" id="phone" placeholder="Contoh: 012-3456789" oninput="saveToMemory()">
 
<label>Alamat Lokasi</label>
<textarea id="address" placeholder="Alamat penuh lokasi sewaan" oninput="saveToMemory()"></textarea>
 
<label>Sales / PIC</label>
<input type="text" id="pic" placeholder="Contoh: Yazid" oninput="saveToMemory()">
 
<div class="flex-row">
<div>
<label>Bilangan Unit</label>
<input type="number" id="unit" value="1" min="1" oninput="updateEndDatePreview(); saveToMemory();">
</div>
<div>
<label>Bilangan Hari Sewa</label>
<input type="number" id="days" value="30" min="1" oninput="updateEndDatePreview(); saveToMemory();">
</div>
</div>
 
<label>Tarikh Mula Sewaan</label>
<input type="date" id="startDate" onchange="updateEndDatePreview(); saveToMemory();">
 
<p class="small"><strong>Tarikh Tamat:</strong> <span id="endDatePreview" style="color: var(--blue); font-weight: bold;">-</span></p>
 
<label>Jumlah Bayaran Customer Asal (RM)</label>
<input type="number" id="rental" placeholder="Contoh: 600" oninput="saveToMemory()">
 
<div class="flex-row">
<div>
<label>Deposit Diterima (RM)</label>
<input type="number" id="deposit" value="0" oninput="saveToMemory()">
</div>
<div>
<label>Kos Transport (RM)</label>
<input type="number" id="transport" value="0" oninput="saveToMemory()">
</div>
</div>

<label>Tanggungan Kos Transport</label>
<select id="transportType" onchange="calculate(); saveToMemory();">
  <option value="tambah">Customer Tambah (Caj Tambahan Luar Harga Sewa)</option>
  <option value="absorb">Syarikat Absorb (Tolak dari Komisyen Team)</option>
</select>
 
<div style="display:flex; gap: 10px; margin-top: 16px;">
<button class="btn-primary" style="flex: 2; margin: 0;" onclick="isSearchedFromDb = false; calculate()">Kira & Generate Text</button>
<button class="btn-dark" style="flex: 1; background: #6b7280; margin: 0;" onclick="clearMemory()">Reset</button>
</div>
</div>
 
<div id="result"></div>
</div>
 
<script>
// --- CONFIGURATION & MEMORY LOGIC ---
const STORAGE_KEY = "MKS_CALCULATOR_DATA";
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwLtMUSkyaJhgt11W4xdo6KJXSeb2L3sW0GHN_mKa-xSO7MvJwzPKcQSy6jyX7K4_I/exec";

let isSearchedFromDb = false;

function generateDocNo(prefix) {
const now = new Date();
const y = now.getFullYear();
const m = String(now.getMonth() + 1).padStart(2, "0");
const d = String(now.getDate()).padStart(2, "0");
const random = String(Math.floor(Math.random() * 999) + 1).padStart(3, "0");
return prefix + "-" + y + m + d + "-" + random;
}

function saveToMemory() {
const data = {
customerName: document.getElementById("customerName").value,
phone: document.getElementById("phone").value,
address: document.getElementById("address").value,
pic: document.getElementById("pic").value,
unit: document.getElementById("unit").value,
days: document.getElementById("days").value,
startDate: document.getElementById("startDate").value,
rental: document.getElementById("rental").value,
deposit: document.getElementById("deposit").value,
transport: document.getElementById("transport").value,
transportType: document.getElementById("transportType").value,
quoteNo: document.getElementById("quoteNo").value
};
localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadFromMemory() {
const stored = localStorage.getItem(STORAGE_KEY);
if (stored) {
const data = JSON.parse(stored);
document.getElementById("customerName").value = data.customerName || "";
document.getElementById("phone").value = data.phone || "";
document.getElementById("address").value = data.address || "";
document.getElementById("pic").value = data.pic || "";
document.getElementById("unit").value = data.unit || 1;
document.getElementById("days").value = data.days || 30;
document.getElementById("startDate").value = data.startDate || "";
document.getElementById("rental").value = data.rental || "";
document.getElementById("deposit").value = data.deposit || 0;
document.getElementById("transport").value = data.transport || 0;
document.getElementById("transportType").value = data.transportType || "tambah";
document.getElementById("quoteNo").value = data.quoteNo || generateDocNo("QT");
updateEndDatePreview();
} else {
document.getElementById("quoteNo").value = generateDocNo("QT");
}
}

function clearMemory() {
if(confirm("Adakah anda pasti mahu set semula semua data input?")) {
localStorage.removeItem(STORAGE_KEY);
location.reload();
}
}

window.onload = function() {
loadFromMemory();
};
 
function formatRM(value) {
return "RM " + Number(value || 0).toFixed(2);
}
 
function formatDate(dateString) {
if (!dateString) return "-";
const date = new Date(dateString);
return date.toLocaleDateString("ms-MY", { day: "2-digit", month: "2-digit", year: "numeric" });
}
 
function calculateEndDate(startDate, days) {
if (!startDate || days < 1) return "-";
const date = new Date(startDate);
date.setDate(date.getDate() + days - 1);
return date.toLocaleDateString("ms-MY", { day: "2-digit", month: "2-digit", year: "numeric" });
}
 
function updateEndDatePreview() {
const startDate = document.getElementById("startDate").value;
const days = Number(document.getElementById("days").value);
document.getElementById("endDatePreview").innerText = calculateEndDate(startDate, days);
}
 
function cleanPhone(phone) {
let cleaned = phone.replace(/\D/g, "");
if (cleaned.startsWith("0")) cleaned = "6" + cleaned;
if (!cleaned.startsWith("6")) cleaned = "6" + cleaned;
return cleaned;
}
 
function calculate() {
const quoteNo = document.getElementById("quoteNo").value;
const customerName = document.getElementById("customerName").value || "-";
const phone = document.getElementById("phone").value || "-";
const address = document.getElementById("address").value || "-";
const pic = document.getElementById("pic").value || "-";
 
const unit = Number(document.getElementById("unit").value);
const days = Number(document.getElementById("days").value);
const startDate = document.getElementById("startDate").value;
 
const rental = Number(document.getElementById("rental").value);
const deposit = Number(document.getElementById("deposit").value);
const transport = Number(document.getElementById("transport").value);
const transportType = document.getElementById("transportType").value;
 
if (unit < 1 || days < 1 || rental < 0) {
alert("Sila semak bilangan unit, hari sewa dan jumlah bayaran.");
return;
}
 
// LOGIK BARU: Share Syarikat 30% daripada jumlah asal customer bayar
const companyShareTotal = rental * 0.30; 

// Pelarasan Jumlah Yang Perlu Dibayar oleh Customer mengikut jenis transport
let totalCustomerPay = rental;
if (transportType === "tambah") {
  totalCustomerPay = rental + transport;
}

// LOGIK BARU: Jumlah cust bayar - deposit = baki bayaran
const balance = totalCustomerPay - deposit;
 
// LOGIK BARU: Pengiraan Komisyen Team berdasarkan tanggungan transport
let commission = 0;
if (transportType === "tambah") {
  commission = rental - companyShareTotal; // Transport dibayar lebih oleh cust, jadi komisyen tak terusik
} else {
  commission = rental - companyShareTotal - transport; // Ditandakan tolak dari komisyen team
}
 
const startDateText = formatDate(startDate);
const endDateText = calculateEndDate(startDate, days);
 
const internalText =
`📋 MKS RENTAL BREAKDOWN\n\n` +
`Quotation No : ${quoteNo}\n\n` +
`Customer : ${customerName}\n` +
`Telefon : ${phone}\n\n` +
`Alamat :\n${address}\n\n` +
`Sales / PIC : ${pic}\n\n` +
`Bilangan Unit : ${unit}\n` +
`Tempoh Sewa : ${days} hari\n` +
`Tarikh Mula : ${startDateText}\n` +
`Tarikh Tamat : ${endDateText}\n\n` +
`💰 Jumlah Bayaran Customer (Total)\n${formatRM(totalCustomerPay)}\n` +
`(Harga Asal: ${formatRM(rental)} | Transport: ${formatRM(transport)} [${transportType === 'tambah' ? 'Daj ke Cust' : 'Absorb Syarikat'}])\n\n` +
`💳 Deposit Diterima\n${formatRM(deposit)}\n\n` +
`🧾 Baki Bayaran Customer\n${formatRM(balance)}\n\n` +
`🏢 Share Syarikat (30%)\n${formatRM(companyShareTotal)}\n\n` +
`🚚 Kos Transport\n${formatRM(transport)}\n\n` +
`💵 Komisyen / Baki Team\n${formatRM(commission)}\n`;
 
const customerText =
`Assalamualaikum / Salam Sejahtera.\n\n` +
`Berikut adalah sebut harga sewaan Aircooler Gergasi daripada Mat Kipas Sejuk.\n\n` +
`Quotation No : ${quoteNo}\n\n` +
`Nama : ${customerName}\n` +
`Telefon : ${phone}\n\n` +
`Alamat Lokasi :\n${address}\n\n` +
`📦 Bilangan Unit : ${unit} unit\n` +
`📅 Tempoh Sewaan : ${days} hari\n` +
`🗓️ Tarikh Mula : ${startDateText}\n` +
`🗓️ Tarikh Tamat : ${endDateText}\n\n` +
`💰 Jumlah Sewaan\n${formatRM(totalCustomerPay)}\n\n` +
`💳 Deposit\n${formatRM(deposit)}\n\n` +
`🧾 Baki Bayaran\n${formatRM(balance)}\n\n` +
`Harga termasuk:\n` +
`✅ Sewaan Aircooler Gergasi\n` +
`✅ Bantuan pemasangan\n` +
`✅ Delivery ${transportType === 'absorb' ? '(Percuma)' : ''}\n\n` +
`Terima kasih kerana memilih Mat Kipas Sejuk.\n\n` +
`www.matkipassejuk.my\n`;
 
let warning = "";
if (commission < 0) warning += `<div class="warning">⚠️ Komisyen negatif. Sila semak harga sewaan atau kos transport.</div>`;
if (balance < 0) warning += `<div class="warning">⚠️ Deposit lebih tinggi daripada jumlah sewaan. Sila semak semula.</div>`;
 
let conditionalButtonsHTML = "";
if (isSearchedFromDb) {
  conditionalButtonsHTML = `
  <div style="display: flex; gap: 8px; margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 14px;">
    <button class="btn-primary" style="flex:1; background:#4f46e5; margin:0;" onclick="printDocument('INV')">🧾 Print Invoice</button>
    <button class="btn-primary" style="flex:1; background:#0891b2; margin:0;" onclick="printDocument('RCPT')">💵 Print Receipt</button>
  </div>
  `;
}

document.getElementById("result").innerHTML = `
<div class="card">
<h2>Ringkasan Kiraan</h2>
 
<div class="summary">
<p><span>Jumlah Sewaan Asas:</span> <strong>` + formatRM(rental) + `</strong></p>
<p><span>Kos Transport (` + (transportType === 'tambah' ? 'Cust' : 'Absorb') + `):</span> <strong>` + formatRM(transport) + `</strong></p>
<p><span>Jumlah Perlu Bayar (Cust):</span> <strong style="color:var(--blue)">` + formatRM(totalCustomerPay) + `</strong></p>
<p><span>Deposit Diterima:</span> <strong>` + formatRM(deposit) + `</strong></p>
<p><span>Baki Bayaran (Cust):</span> <strong>` + formatRM(balance) + `</strong></p>
<p><span>Share Syarikat (30%):</span> <strong>` + formatRM(companyShareTotal) + `</strong></p>
<p><span>Komisyen / Baki Team:</span> <strong style="color:var(--green)">` + formatRM(commission) + `</strong></p>
</div>
 
<div class="flex-row" style="margin-top:15px;">
  <button class="btn-success" style="flex: 1.2; margin:0;" onclick="saveRecord()">💾 Save Job</button>
  <button class="btn-primary" style="flex: 1; margin:0; background: #0284c7;" onclick="printDocument('QT')">🖨️ Quotation</button>
</div>
 
` + warning + `
</div>
 
<div class="card">
<h2>Copy Text #1 - Internal MKS</h2>
<textarea id="internalText"></textarea>
<div style="display:flex; gap:6px;">
  <button class="btn-copy" style="flex:1;" onclick="copyText('internalText')">📋 Copy Internal</button>
  <button class="btn-wa" style="flex:1;" onclick="sendWhatsapp('internalText')">📱 WhatsApp</button>
</div>
</div>
 
<div class="card">
<h2>Copy Text #2 - Quote Customer</h2>
<textarea id="customerText"></textarea>
<div style="display:flex; gap:6px;">
  <button class="btn-copy" style="flex:1;" onclick="copyText('customerText')">📋 Copy Quote</button>
  <button class="btn-wa" style="flex:1;" onclick="sendWhatsappToCustomer('customerText')">📱 WhatsApp Cust</button>
</div>
${conditionalButtonsHTML}
</div>
`;

document.getElementById("internalText").value = internalText;
document.getElementById("customerText").value = customerText;
}
 
function copyText(id) {
const textArea = document.getElementById(id);
textArea.select();
navigator.clipboard.writeText(textArea.value)
.then(() => alert("Text berjaya disalin!"))
.catch(() => alert("Gagal menyalin text. Sila salin manual."));
}
 
function sendWhatsapp(id) {
const text = document.getElementById(id).value;
window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}
 
function sendWhatsappToCustomer(id) {
const text = document.getElementById(id).value;
const phone = document.getElementById("phone").value;
if (!phone || phone === "-") { sendWhatsapp(id); return; }
const clean = cleanPhone(phone);
window.open("https://wa.me/" + clean + "?text=" + encodeURIComponent(text), "_blank");
}
 
function toggleDarkMode() {
document.body.classList.toggle("dark");
}

// --- FUNGSI CARIAN REKOD DARI GOOGLE SHEET ---
async function searchRecord() {
  const searchInput = document.getElementById("searchQt").value.trim();
  if (!searchInput) {
    alert("Sila masukkan No Quotation!");
    return;
  }
  
  const btn = document.querySelector("button[onclick='searchRecord()']");
  btn.innerText = "⏳ Mencari...";
  btn.disabled = true;
  
  try {
    const url = WEBAPP_URL + "?action=search&qtNo=" + encodeURIComponent(searchInput);
    const response = await fetch(url);
    const result = await response.json();
    
    if (result.status === 'success') {
      const data = result.data;
      
      document.getElementById("quoteNo").value = data.qtNo;
      document.getElementById("customerName").value = data.customerName;
      document.getElementById("phone").value = data.phone;
      document.getElementById("address").value = data.address;
      document.getElementById("pic").value = data.pic;
      document.getElementById("unit").value = data.unit;
      document.getElementById("days").value = data.days;
      document.getElementById("rental").value = data.rental;
      document.getElementById("deposit").value = data.deposit;
      document.getElementById("transport").value = data.transport || 0;
      document.getElementById("transportType").value = data.transportType || "tambah";
      
      if (data.startDate) {
        const dateObj = new Date(data.startDate);
        if (!isNaN(dateObj.getTime())) {
          const yyyy = dateObj.getFullYear();
          const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
          const dd = String(dateObj.getDate()).padStart(2, '0');
          document.getElementById("startDate").value = `${yyyy}-${mm}-${dd}`;
        }
      }
      
      isSearchedFromDb = true; 
      calculate(); 
      alert("✅ Data berjaya dimuatkan! Butang Invoice & Receipt kini aktif di bawah.");
    } else {
      alert("❌ " + result.message);
    }
  } catch (error) {
    console.error("Search Error:", error);
    alert("❌ Gagal berhubung dengan database. Pastikan Web App menyokong GET request.");
  } finally {
    btn.innerText = "Cari Job";
    btn.disabled = false;
  }
}
 
async function saveRecord() {
const btn = document.querySelector("button[onclick='saveRecord()']");
if (btn) { btn.disabled = true; btn.innerText = "⏳ Saving..."; }
 
try {
const quoteNo = document.getElementById("quoteNo").value;
const rental = parseFloat(document.getElementById("rental").value) || 0;
const deposit = parseFloat(document.getElementById("deposit").value) || 0;
const transport = parseFloat(document.getElementById("transport").value) || 0;
const transportType = document.getElementById("transportType").value;
const startDate = document.getElementById("startDate").value;
 
const data = {
jobId: quoteNo.replace("QT-",""),
qtNo: quoteNo,
invNo: quoteNo.replace("QT-","INV-"),
rcptNo: quoteNo.replace("QT-","RCPT-"),
customerName: document.getElementById("customerName").value,
phone: document.getElementById("phone").value,
address: document.getElementById("address").value,
unit: document.getElementById("unit").value,
days: document.getElementById("days").value,
startDate: startDate, 
transport: transport, 
transportType: transportType, // Menyimpan status pilihan ke db
rental: rental,
deposit: deposit,
balance: (transportType === "tambah" ? rental + transport : rental) - deposit,
status: "Quoted",
pic: document.getElementById("pic").value
};
 
const response = await fetch(WEBAPP_URL, {
method: "POST",
mode: "no-cors",
headers: { 
"Content-Type": "application/json",
"X-App-Token": "MKS-SECURE-2026"
},
body: JSON.stringify(data)
});
 
alert("🎉 Job successfully saved to Google Sheet!");
localStorage.removeItem(STORAGE_KEY);
} catch (error) {
console.error("Error saving record:", error);
alert("❌ Failed to save job. Check console for details.");
} finally {
if (btn) { btn.disabled = false; btn.innerText = "💾 Save Job"; }
}
}
 
// --- DRY CENTRALIZED DOCUMENT PRINTER ---
function printDocument(type) {
const quoteNo = document.getElementById("quoteNo").value;
let docTitle = "Quotation";
let docNo = quoteNo;
 
if (type === 'INV') { docTitle = "Invoice"; docNo = quoteNo.replace("QT-", "INV-"); }
if (type === 'RCPT') { docTitle = "Official Receipt"; docNo = quoteNo.replace("QT-", "RCPT-"); }

const customerName = document.getElementById("customerName").value || "-";
const phone = document.getElementById("phone").value || "-";
const address = document.getElementById("address").value || "-";
const unit = Number(document.getElementById("unit").value || 0);
const days = Number(document.getElementById("days").value || 0);
const startDate = document.getElementById("startDate").value;
const rental = Number(document.getElementById("rental").value || 0);
const transport = Number(document.getElementById("transport").value || 0);
const transportType = document.getElementById("transportType").value;
const deposit = Number(document.getElementById("deposit").value || 0);

// Penyelarasan amaun untuk cetakan dokumen rasmi
const displayTransport = (transportType === "tambah") ? transport : 0;
const grandTotal = rental + displayTransport;
const balanceDue = grandTotal - deposit;
 
const today = new Date().toLocaleDateString("ms-MY", { day: "2-digit", month: "2-digit", year: "numeric" });
const startDateText = startDate ? new Date(startDate).toLocaleDateString("ms-MY", { day: "2-digit", month: "2-digit", year: "numeric" }) : "-";
const endDateObj = startDate ? new Date(startDate) : null;
if (endDateObj) { endDateObj.setDate(endDateObj.getDate() + days - 1); }
const endDateText = endDateObj ? endDateObj.toLocaleDateString("ms-MY", { day: "2-digit", month: "2-digit", year: "numeric" }) : "-";
 
let financialBoxHTML = `
<div class="flex justify-between"><span class="text-gray-600">Total Rental</span><span class="font-medium">RM ${rental.toFixed(2)}</span></div>
<div class="flex justify-between"><span class="text-gray-600">Transport Cost</span><span class="font-medium">RM ${displayTransport.toFixed(2)} ${transportType === 'absorb' && transport > 0 ? '(Absorb)' : ''}</span></div>
