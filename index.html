<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MKS Rental Calculator</title>
  <style>
    :root {
      --bg: #f4f4f4;
      --card: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #dddddd;
      --blue: #007bff;
      --green: #28a745;
      --wa: #25D366;
      --warning: #fff3cd;
    }

    body.dark {
      --bg: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --muted: #d1d5db;
      --border: #374151;
      --warning: #4b3b12;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 11px;
      margin-top: 5px;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: var(--card);
      color: var(--text);
    }

    textarea {
      min-height: 220px;
      white-space: pre-wrap;
    }

    button {
      padding: 12px 18px;
      margin-top: 12px;
      margin-right: 6px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .btn-primary { background: var(--blue); color: #fff; }
    .btn-copy { background: var(--green); color: #fff; }
    .btn-wa { background: var(--wa); color: #fff; }
    .btn-dark { background: #374151; color: #fff; }

    .summary {
      background: rgba(0,123,255,0.12);
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .warning {
      background: var(--warning);
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-weight: bold;
    }

    .small {
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Mat Kipas Sejuk</h1>
    <h2>Rental Calculator</h2>
    <button class="btn-dark" onclick="toggleDarkMode()">🌙 Dark Mode</button>

    <label>Quotation No</label>
    <input type="text" id="quoteNo" readonly>

    <label>Nama Customer</label>
    <input type="text" id="customerName" placeholder="Contoh: Restoran XYZ">

    <label>No Telefon Customer</label>
    <input type="text" id="phone" placeholder="Contoh: 012-3456789">

    <label>Alamat Lokasi</label>
    <textarea id="address" placeholder="Alamat penuh lokasi sewaan"></textarea>

    <label>Sales / PIC</label>
    <input type="text" id="pic" placeholder="Contoh: Yazid">

    <label>Bilangan Unit</label>
    <input type="number" id="unit" value="1" min="1" oninput="updateEndDatePreview()">

    <label>Bilangan Hari Sewa</label>
    <input type="number" id="days" value="30" min="1" oninput="updateEndDatePreview()">

    <label>Tarikh Mula Sewaan</label>
    <input type="date" id="startDate" onchange="updateEndDatePreview()">

    <p class="small"><strong>Tarikh Tamat:</strong> <span id="endDatePreview">-</span></p>

    <label>Jumlah Bayaran Customer (RM)</label>
    <input type="number" id="rental" placeholder="Contoh: 600">

    <label>Deposit Diterima (RM)</label>
    <input type="number" id="deposit" value="0">

    <label>Kos Transport (RM)</label>
    <input type="number" id="transport" value="0">

    <button class="btn-primary" onclick="calculate()">Kira & Generate Text</button>
  </div>

  <div id="result"></div>

<script>
function generateQuoteNo() {
  const now = new Date();

  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");

  const random = String(Math.floor(Math.random() * 999) + 1).padStart(3, "0");

  return `MKS-${y}${m}${d}-${random}`;
}

document.getElementById("quoteNo").value = generateQuoteNo();

function formatRM(value) {
  return "RM " + Number(value || 0).toFixed(2);
}

function formatDate(dateString) {
  if (!dateString) return "-";

  const date = new Date(dateString);

  return date.toLocaleDateString("ms-MY", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });
}

function calculateEndDate(startDate, days) {
  if (!startDate || days < 1) return "-";

  const date = new Date(startDate);
  date.setDate(date.getDate() + days - 1);

  return date.toLocaleDateString("ms-MY", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });
}

function updateEndDatePreview() {
  const startDate = document.getElementById("startDate").value;
  const days = Number(document.getElementById("days").value);

  document.getElementById("endDatePreview").innerText = calculateEndDate(startDate, days);
}

function cleanPhone(phone) {
  let cleaned = phone.replace(/\D/g, "");

  if (cleaned.startsWith("0")) {
    cleaned = "6" + cleaned;
  }

  if (!cleaned.startsWith("6")) {
    cleaned = "6" + cleaned;
  }

  return cleaned;
}

function calculate() {
  const quoteNo = document.getElementById("quoteNo").value;
  const customerName = document.getElementById("customerName").value || "-";
  const phone = document.getElementById("phone").value || "-";
  const address = document.getElementById("address").value || "-";
  const pic = document.getElementById("pic").value || "-";

  const unit = Number(document.getElementById("unit").value);
  const days = Number(document.getElementById("days").value);
  const startDate = document.getElementById("startDate").value;

  const rental = Number(document.getElementById("rental").value);
  const deposit = Number(document.getElementById("deposit").value);
  const transport = Number(document.getElementById("transport").value);

  if (unit < 1 || days < 1 || rental < 0) {
    alert("Sila semak bilangan unit, hari sewa dan jumlah bayaran.");
    return;
  }

  const companySharePerUnit = 45 + ((days - 1) * 5);
  const companyShareTotal = companySharePerUnit * unit;
  const commission = rental - companyShareTotal - transport;
  const balance = rental - deposit;

  const startDateText = formatDate(startDate);
  const endDateText = calculateEndDate(startDate, days);

  const internalText =
`📋 MKS RENTAL BREAKDOWN

Quotation No : ${quoteNo}

Customer : ${customerName}
Telefon : ${phone}

Alamat :
${address}

Sales / PIC : ${pic}

Bilangan Unit : ${unit}
Tempoh Sewa : ${days} hari
Tarikh Mula : ${startDateText}
Tarikh Tamat : ${endDateText}

💰 Jumlah Bayaran Customer
${formatRM(rental)}

💳 Deposit Diterima
${formatRM(deposit)}

🧾 Baki Bayaran Customer
${formatRM(balance)}

🏢 Share Syarikat
${formatRM(companyShareTotal)}
(${formatRM(companySharePerUnit)} x ${unit} unit)

🚚 Kos Transport
${formatRM(transport)}

💵 Komisyen / Baki Team
${formatRM(commission)}
`;

  const customerText =
`Assalamualaikum / Salam Sejahtera.

Berikut adalah sebut harga sewaan Aircooler Gergasi daripada Mat Kipas Sejuk.

Quotation No : ${quoteNo}

Nama : ${customerName}
Telefon : ${phone}

Alamat Lokasi :
${address}

📦 Bilangan Unit : ${unit} unit
📅 Tempoh Sewaan : ${days} hari
🗓️ Tarikh Mula : ${startDateText}
🗓️ Tarikh Tamat : ${endDateText}

💰 Jumlah Sewaan
${formatRM(rental)}

💳 Deposit
${formatRM(deposit)}

🧾 Baki Bayaran
${formatRM(balance)}

Harga termasuk:
✅ Sewaan Aircooler Gergasi
✅ Bantuan pemasangan
✅ Delivery

Terima kasih kerana memilih Mat Kipas Sejuk.

www.matkipassejuk.my
`;

  let warning = "";

  if (commission < 0) {
    warning += `<div class="warning">⚠️ Komisyen negatif. Sila semak harga sewaan atau kos transport.</div>`;
  }

  if (balance < 0) {
    warning += `<div class="warning">⚠️ Deposit lebih tinggi daripada jumlah sewaan. Sila semak semula.</div>`;
  }

  document.getElementById("result").innerHTML = `
    <div class="card">
      <h2>Ringkasan Kiraan</h2>

      <div class="summary">
        <p><strong>Jumlah Bayaran Customer:</strong> ${formatRM(rental)}</p>
        <p><strong>Deposit:</strong> ${formatRM(deposit)}</p>
        <p><strong>Baki Bayaran:</strong> ${formatRM(balance)}</p>
        <p><strong>Share Syarikat:</strong> ${formatRM(companyShareTotal)}</p>
        <p><strong>Kos Transport:</strong> ${formatRM(transport)}</p>
        <p><strong>Komisyen / Baki Team:</strong> ${formatRM(commission)}</p>
      </div>

      ${warning}
    </div>

    <div class="card">
      <h2>Copy Text #1 - Internal MKS</h2>
      <textarea id="internalText">${internalText}</textarea>
      <button class="btn-copy" onclick="copyText('internalText')">📋 Copy Internal</button>
      <button class="btn-wa" onclick="sendWhatsapp('internalText')">📱 WhatsApp Internal</button>
    </div>

    <div class="card">
      <h2>Copy Text #2 - Quote Customer</h2>
      <textarea id="customerText">${customerText}</textarea>
      <button class="btn-copy" onclick="copyText('customerText')">📋 Copy Quote</button>
      <button class="btn-wa" onclick="sendWhatsappToCustomer('customerText')">📱 WhatsApp Customer</button>
      <button class="btn-primary" onclick="printQuotation()">🖨️ Print Quotation</button>
    </div>
  `;
}

function copyText(id) {
  const textArea = document.getElementById(id);
  textArea.select();
  textArea.setSelectionRange(0, 99999);

  navigator.clipboard.writeText(textArea.value)
    .then(() => alert("Text copied!"))
    .catch(() => alert("Copy failed. Sila copy manual."));
}

function sendWhatsapp(id) {
  const text = document.getElementById(id).value;
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}

function sendWhatsappToCustomer(id) {
  const text = document.getElementById(id).value;
  const phone = document.getElementById("phone").value;

  if (!phone || phone === "-") {
    sendWhatsapp(id);
    return;
  }

  const clean = cleanPhone(phone);
  window.open("https://wa.me/" + clean + "?text=" + encodeURIComponent(text), "_blank");
}

function toggleDarkMode() {
  document.body.classList.toggle("dark");
}

function printQuotation() {
    alert("Print quotation coming soon");
}
</script>

</body>
</html>
